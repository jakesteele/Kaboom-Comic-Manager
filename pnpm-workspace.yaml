packages:
  - 'shared'
  - 'server'
  - 'web'

# Dependencies allowed to run install/build scripts (native modules).
# pnpm 12 reads this here; the old package.json "pnpm.onlyBuiltDependencies" key is ignored.
allowBuilds:
  "@parcel/watcher": true
  better-sqlite3: true
  esbuild: true
  sharp: true
  vue-demi: true
